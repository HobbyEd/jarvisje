name: sogyo-chatbot

# Production stack (host identity in .env: DEPLOY_USER, DEPLOY_HOST, HOST_HOME).
# Compose project name stays `sogyo-chatbot` so the running Ollama container
# (sogyo-ollama, Gemma 3 4B on ~/sogyo-ollama) keeps the existing Docker
# network. Host dirs are jarvisje-chatbot / jarvisje-chatbot-data.
# Managed by systemd:
#   sogyo-ollama.service  → docker compose up -d ollama
#   sogyo-chatbot.service → docker compose up -d app
#
# Volume paths use HOST_HOME from the host .env (next to this file).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sogyo-ollama
    ports:
      - "11434:11434"
    volumes:
      - ${HOST_HOME}/sogyo-ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      # 16 GB kaart valt in de 4k-standaard. 8192 is het dubbele, nog ruim naast Gemma.
      - OLLAMA_CONTEXT_LENGTH=8192
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    image: jarvisje:${IMAGE_TAG:-latest}
    pull_policy: never
    container_name: jarvisje-chatbot-app
    depends_on:
      - ollama
    ports:
      - "8080:8001"
    volumes:
      - ${HOST_HOME}/jarvisje-chatbot-data:/app/data
    # ADR-011: secrets from host file next to this compose (never baked into image).
    # Deploy places ~/jarvisje-chatbot/.env (mode 600).
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=gemma3:4b
      - LLM_TIMEOUT=180
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Query embeddings stay on CPU. The UI-spawned worker overrides this to cuda.
      - EMBEDDING_DEVICE=cpu
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; u='http://localhost:8001/health'; sys.exit(0 if urllib.request.urlopen(u, timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    mem_limit: 12g
    memswap_limit: 12g
    cpus: "6.0"
    pids_limit: 512
    # GPU is visible so the ingest subprocess can embed on it.
    # The API process itself keeps EMBEDDING_DEVICE=cpu (no resident BGE next to Gemma).

  # ADR-010: one-shot ingest worker (cron/manual). UI spawn uses subprocess inside app.
  # Example:
  #   docker compose -f docker-compose.yaml --profile ingest run --rm ingest --max-pages 500
  ingest:
    image: jarvisje:${IMAGE_TAG:-latest}
    pull_policy: never
    profiles: ["ingest"]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ${HOST_HOME}/jarvisje-chatbot-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=0
      - EMBEDDING_DEVICE=cuda
    restart: "no"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 8g
    cpus: "4.0"
    entrypoint: ["python", "-m", "jarvisje.ingestion.worker"]
