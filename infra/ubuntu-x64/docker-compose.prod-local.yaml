name: sogyo-chatbot

# Production stack on 192.168.165.15 (enterprise)
# Managed by systemd:
#   sogyo-ollama.service  → docker compose up -d ollama
#   sogyo-chatbot.service → docker compose up -d app
#
# Absolute host paths so volumes work when compose runs as root via systemd.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sogyo-ollama
    ports:
      - "11434:11434"
    volumes:
      - /home/evdillen/sogyo-ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    image: sogyo-chatbot:${IMAGE_TAG:-latest}
    pull_policy: never
    container_name: sogyo-chatbot-app
    depends_on:
      - ollama
    ports:
      - "8080:8001"
    volumes:
      - /home/evdillen/sogyo-chatbot-data:/app/data
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=gemma3:4b
      - LLM_TIMEOUT=180
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
      - NVIDIA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - EMBEDDING_DEVICE=cpu
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; u='http://localhost:8001/health'; sys.exit(0 if urllib.request.urlopen(u, timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    mem_limit: 12g
    memswap_limit: 12g
    cpus: "6.0"
    pids_limit: 512
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
