[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sogyo-chatbot"
version = "0.7.1"
description = "Domein-specifieke RAG-chatbot voor Sogyo content (MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Edwin van Dillen"}
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "trafilatura>=1.12",
  "sentence-transformers>=3.1,<4.0",
  "chromadb>=0.5",
  "pydantic>=2.7",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length handled by formatter
